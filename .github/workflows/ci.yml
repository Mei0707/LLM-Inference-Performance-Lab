name: CPU validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -m 'not gpu'
      - run: inference-lab demo --output results
      - run: python scripts/validate_artifacts.py results
      - run: docker compose --profile mock config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-benchmark-artifacts
          path: results/
