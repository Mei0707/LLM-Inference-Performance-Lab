[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-lab"
version = "0.1.0"
description = "Reproducible streaming inference benchmarks, telemetry and regression analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1", "pydantic>=2.8,<3", "PyYAML>=6,<7",
  "pyarrow>=17", "matplotlib>=3.9,<4", "prometheus-client>=0.21,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12,<14"]
tokenizer = ["transformers>=4.45,<6"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
inference-lab = "inference_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["gpu: opt-in integration tests against a real NVIDIA vLLM server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
