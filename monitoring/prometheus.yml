global:
  scrape_interval: 1s
scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
  - job_name: mock
    static_configs:
      - targets: ["mock:8000"]
  - job_name: gpu
    static_configs:
      - targets: ["dcgm:9400"]
  - job_name: benchmark
    static_configs:
      - targets: ["bench:9108", "bench-gpu:9108"]
